name: Build

# Собирает standalone-приложение DevTime (веб-UI + FastAPI + pywebview)
# под Linux / Windows / macOS через Vite + PyInstaller. Артефакты — на
# вкладке Actions; при пуше тега v* — прикрепляются к GitHub Release.

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Быстрый гейт: синтаксис Python + сборка фронтенда ────────────────────
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python syntax check
        run: |
          python -m py_compile app.py legacy_tk.py db.py utils.py \
            api/__init__.py api/server.py api/achievements.py api/profile.py \
            ui/__init__.py ui/dialogs.py ui/main_window.py
      - name: Tests
        run: |
          pip install fastapi "uvicorn[standard]" pytest httpx
          pytest tests/ -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Frontend build check
        working-directory: web
        run: |
          npm ci
          npm run build

  # ── Сборка под три ОС ────────────────────────────────────────────────────
  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        shell: bash
        run: |
          SEP=":"; [ "$RUNNER_OS" = "Windows" ] && SEP=";"
          pyinstaller --noconfirm --clean --onefile --windowed \
            --name DevTime \
            --add-data "web/dist${SEP}web/dist" \
            --collect-all uvicorn \
            --collect-all webview \
            app.py

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd dist
          tar -czf "DevTime-${{ matrix.name }}.tar.gz" DevTime*

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/DevTime.exe -DestinationPath dist/DevTime-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevTime-${{ matrix.name }}
          path: |
            dist/DevTime-${{ matrix.name }}.tar.gz
            dist/DevTime-windows.zip
          if-no-files-found: ignore

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DevTime-${{ matrix.name }}.tar.gz
            dist/DevTime-windows.zip
          fail_on_unmatched_files: false
